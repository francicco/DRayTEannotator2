genome: GENOMEPATH
outdir: OUTPUTDIR
species: SPECIESTAG
threads: 4
preset: generic_insect
storage:
  mode: keep
repeatmodeler_dir: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/share/RepeatModeler"
repeatscout_dir: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin"
repeatmasker_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/RepeatMasker"
repeatmodeler_extend_script: "/user/work/tk19812/software/DRayTEannotator2-Hmel-test/davidExtendConsRAM.pl"
repeatclassifier_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/RepeatClassifier"
ucsc_tools_dir: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin"
repeat_after_me_dir: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin"
phrap_dir: "/user/work/tk19812/software/phrap"
repeatpeps_db_dir: "/user/work/tk19812/Databases/Dfam_4.0/repeatpeps"
diamond_bin: diamond
getorf_bin: getorf
cdhit_est_bin: cd-hit-est
cdhit_identity: 0.95
extension_workers: 16
extension_max_hits: 50
extension_left_buffer: 100
extension_right_buffer: 100
min_orf: 500
structure:
  heliano:
    enabled: true
    # Use the full path to your HELIANO executable.
    bin: "/user/work/tk19812/micromamba/envs/earlgrey/bin/heliano"
    mmseqs_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/mmseqs"
    redundancy_identity: 0.9
    query_cov: 0.8
    threads: 16
annotation_refinement:
  mode: loose
  max_gap: 150
  include_nested: false
  max_consensus_overlap: 50
  max_consensus_jump: 10000
family_inspection:
  enabled: true
  use_symlinks: true
  include_plots: true
  archive: true
  include_non_te_repeats: false
classification:
  enabled: true
  preliminary: true
  final: true
  min_orf_nt: 300
  forward_only: false
  pfam_db: Path-to-Pfam-A.hmm
  hmmscan_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/hmmscan"
  dfam:
    enabled: true
    database: Path-to-Dfam.hmm
    taxon: Lineage
    ancestors: true
    descendants: true
    curated_only: true
    engine: nhmmer
    famdb_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/famdb.py"
    nhmmer_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/nhmmer"
    threads: 15  # nhmmer also starts a coordinating thread.
    chunks: 1
    jobs: 1
    require_ga: true
    min_score: 20.0
    max_evalue: 1.0e-05
    min_query_coverage: 0.1
    min_model_coverage: 0.5
    competition_score_fraction: 0.95
    independent: false
    on_missing: error
  mmseqs_bin: "/user/work/tk19812/micromamba/envs/drayann2-hmel-test/bin/mmseqs"
  # Use the classification FASTA derived from HELICONIINILIB.
  #mmseqs_rescue_db: "/user/work/tk19812/HeliconiniiProject/TEannotation/Heliconius.classification.fa"
  chunks: 5
  jobs: 5
  cpu: 1
  taxon: SPECIESTAG 
